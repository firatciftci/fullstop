name: Fullstop
options:
  bundleIdPrefix: com.firatciftci
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 55PN4MC8Q6
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SPARKLE_PUBLIC_KEY: "i34g2DnMsrKHQdUzQDK0h2qEBOX8zQ3HVaOiyoDULhE="
targets:
  Fullstop:
    type: application
    platform: macOS
    sources:
      - path: Fullstop
        excludes:
          - Resources/AppIcon.icon
          - Resources/AppIcon.icon/**
      - path: Fullstop/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Shared
      - path: LaunchDaemons/com.firatciftci.Fullstop.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: FullstopHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Fullstop/Info.plist
      properties:
        CFBundleDisplayName: Fullstop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Firat Ciftci"
        SUFeedURL: https://github.com/firatciftci/fullstop/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.firatciftci.Fullstop
            CFBundleURLSchemes:
              - fullstop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firatciftci.Fullstop
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  FullstopHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: FullstopHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.firatciftci.Fullstop.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
